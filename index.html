<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webgame</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1b2033;
      --ink: #f4f6fb;
      --muted: #a8b0c7;
      --accent: #ffb703;
      --line: #2c334d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #243056, transparent 60%),
        radial-gradient(700px 380px at 100% 0%, #3a2a12, transparent 55%),
        var(--bg);
    }
    main { max-width: 880px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 0.04em; }
    p.lead { margin: 0 0 28px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      min-height: 160px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .emoji { font-size: 34px; }
    h2 { margin: 12px 0 6px; font-size: 22px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.5; }
    footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>webgame</h1>
    <p class="lead">ブラウザですぐ遊べるゲーム。遊んでみてね。</p>
    <div class="grid">
      <a class="card" href="games/emergent-garden/">
        <div class="emoji">🌿</div>
        <h2>創発の庭</h2>
        <p>セル・オートマトンのルールを操り、増殖する感染体からコアを守る創発サバイバル。壁を描き、誕生・生存条件を変えて生き延びろ。</p>
      </a>
      <a class="card" href="games/time-echo/">
        <div class="emoji">⏳</div>
        <h2>タイムエコー</h2>
        <p>自分の過去の動きを録画し、過去の自分 (ゴースト) と協力してスイッチを踏み、扉を開けて出口へ行くタイムループパズル。</p>
      </a>
    </div>
    <footer>キーボードとマウス、スマホのタップでも遊べます。全2タイトル。最終更新 2026-10-24。</footer>
  </main>
</body>
</html>
