<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スネーク</title>
  <style>
    :root { --bg:#0f1220; --ink:#f4f6fb; --muted:#a8b0c7; --accent:#7bd389; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: var(--ink); background: var(--bg);
    }
    .wrap { text-align: center; padding: 16px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .meta { color: var(--muted); margin-bottom: 12px; }
    canvas {
      background: #171c2e; border-radius: 16px; touch-action: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .pad { display: grid; grid-template-columns: 64px 64px 64px; gap: 8px; justify-content: center; margin-top: 14px; }
    button {
      height: 48px; border: 0; border-radius: 12px; background: #243056; color: white; font-size: 20px; cursor: pointer;
    }
    button.wide { grid-column: 2; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>スネーク</h1>
    <div class="meta">スコア <b id="score">0</b>　ベスト <b id="best">0</b></div>
    <canvas id="c" width="360" height="360"></canvas>
    <div class="pad">
      <span></span><button id="up" type="button">↑</button><span></span>
      <button id="left" type="button">←</button>
      <button id="down" type="button">↓</button>
      <button id="right" type="button">→</button>
    </div>
    <p class="meta"><a href="../../index.html">もどる</a></p>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const size = 18;
    const cells = canvas.width / size;
    let snake, dir, nextDir, food, score, best, timer, alive;
    best = Number(localStorage.getItem("snake-best") || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{x: 8, y: 9}, {x: 7, y: 9}, {x: 6, y: 9}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      alive = true;
      scoreEl.textContent = "0";
      placeFood();
      clearInterval(timer);
      timer = setInterval(step, 130);
      draw();
    }
    function placeFood() {
      do {
        food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
      } while (snake.some(p => p.x === food.x && p.y === food.y));
    }
    function setDir(x, y) {
      if (dir.x + x === 0 && dir.y + y === 0) return;
      nextDir = {x, y};
    }
    function step() {
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells || snake.some(p => p.x === head.x && p.y === head.y)) {
        alive = false;
        clearInterval(timer);
        draw();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("snake-best", String(best));
        }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffb703";
      ctx.beginPath();
      ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * 0.32, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? "#9af0a6" : "#4caf6a";
        ctx.fillRect(p.x * size + 1, p.y * size + 1, size - 2, size - 2);
      });
      if (!alive) {
        ctx.fillStyle = "rgba(8,10,18,.62)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ゲームオーバー", canvas.width / 2, canvas.height / 2 - 8);
        ctx.font = "16px sans-serif";
        ctx.fillText("クリックでもう一度", canvas.width / 2, canvas.height / 2 + 22);
      }
    }
    const keys = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]};
    window.addEventListener("keydown", e => {
      const m = keys[e.key];
      if (!m) return;
      e.preventDefault();
      if (!alive) return;
      setDir(m[0], m[1]);
    });
    document.getElementById("up").onclick = () => setDir(0, -1);
    document.getElementById("down").onclick = () => setDir(0, 1);
    document.getElementById("left").onclick = () => setDir(-1, 0);
    document.getElementById("right").onclick = () => setDir(1, 0);
    canvas.addEventListener("pointerdown", () => { if (!alive) reset(); });
    let touchX = 0, touchY = 0;
    canvas.addEventListener("touchstart", e => {
      touchX = e.changedTouches[0].clientX;
      touchY = e.changedTouches[0].clientY;
    }, {passive: true});
    canvas.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }, {passive: true});
    reset();
  </script>
</body>
</html>
