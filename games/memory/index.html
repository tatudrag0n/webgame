<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>色合わせメモリー - 神経衰弱</title>
  <style>
    :root {
      --bg:#0f1220; --card:#1b2033; --ink:#f4f6fb; --muted:#a8b0c7;
      --accent:#b388ff; --line:#2c334d; --panel2:#1d2740;
      --ok:#4fda9a; --bad:#ff6b7a;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh;
      font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #4a3a6b, transparent 60%),
        radial-gradient(700px 380px at 100% 0%, #2a1a3a, transparent 55%),
        var(--bg);
    }
    main { max-width:560px; margin:0 auto; padding:24px 14px 70px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    h1 { margin:0; font-size:26px; letter-spacing:0.06em; }
    h1 small { display:block; font-size:13px; letter-spacing:0.2em; color:var(--accent); font-weight:400; margin-top:4px; }
    .back { color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); font-size:14px; white-space:nowrap; }
    .back:hover { color:var(--ink); border-color:var(--accent); }
    p.sub { margin:0 0 12px; color:var(--muted); font-size:14px; line-height:1.7; }
    .hud { display:flex; gap:10px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:12px; font-size:14px; }
    .hud .item { color:var(--muted); }
    .hud b { color:var(--ink); }
    .hud b.ok { color:var(--ok); } .hud b.bad { color:var(--bad); }
    .sizebar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
    .sizebar button { font-family:inherit; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink); background:var(--panel2); border:1px solid var(--line); }
    .sizebar button:hover { background:#242b45; }
    .sizebar button.active { background:var(--accent); color:#051f2a; border-color:var(--accent); }
    .grid { display:grid; gap:8px; justify-content:center; margin-bottom:14px; touch-action:none; }
    .cardwrap { position:relative; width:72px; height:72px; perspective:600px; }
    @media (max-width:460px){ .grid{grid-template-columns:repeat(4, 66px)!important} .cardwrap{width:66px;height:66px} }
    .card { position:absolute; inset:0; border-radius:14px; border:1.5px solid var(--line); background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer; box-shadow:0 8px 24px -10px rgba(0,0,0,.6); transition:transform .12s, box-shadow .12s; }
    .card:active { transform:scale(.96); }
    .card.open { background:#0f172a; border-color:#6366f1; box-shadow:0 0 0 4px rgba(99,102,241,.25); }
    .card.match { border-color:var(--ok); background:#062719; box-shadow:0 0 0 4px rgba(79,218,154,.25); cursor:default; }
    .card.mismatch { border-color:var(--bad); background:#2d1016; }
    .inner { transform:translateZ(40px); }
    .msg { min-height:1.4em; font-size:14px; color:var(--muted); margin:0 0 10px; text-align:center; }
    .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
    .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
    button { font-family:inherit; border:none; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer; color:var(--ink); background:var(--panel2); border:1px solid var(--line); }
    button:hover { background:#242b45; }
    button.primary { background:var(--accent); color:#051f2a; }
    button.primary:hover { opacity:.92; }
    button.secondary { background:var(--panel2); }
    .rule { font-size:13px; color:var(--muted); line-height:1.75; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-top:8px; }
    .rule b { color:var(--ink); }
    .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:rgba(6,9,16,.88); backdrop-filter:blur(5px); text-align:center; padding:20px; z-index:40; }
    .overlay[hidden] { display:none; }
    .overlay h2 { margin:0 0 10px; font-size:26px; letter-spacing:0.05em; }
    .overlay p { color:var(--muted); margin:0 0 22px; font-size:15px; line-height:1.8; }
  </style>
</head>
<body>
<main>
  <header>
    <a class="back" href="../">← ゲーム一覧へ</a>
    <h1>色合わせメモリー<small>Color Memory — Concentration</small></h1>
  </header>
  <p class="sub">同じ色・同じ形のカードを2枚ずつめくってペアを揃えよう。すべてのペアを完成させるとクリア。</p>

  <div class="hud">
    <div class="item">手数 <b id="moves">0</b></div>
    <div class="item">経過 <b id="time">0.0s</b></div>
    <div class="item">ペア <b id="pairs">0 / 0</b></div>
    <div class="item">ベスト <b id="best">—</b> <b id="bestMoves">—</b></div>
  </div>

  <div class="sizebar">
    <button id="sz4" class="active">4 × 4（8ペア）</button>
    <button id="sz6">6 × 4（12ペア）</button>
    <button id="sz9">6 × 6（18ペア）</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">カードをめくろう</div>
  <div class="row">
    <button id="btnRetry" class="secondary">やり直す</button>
    <button id="btnNew" class="primary">新しい手配</button>
  </div>
  <div class="rule">
    <b>ルール・操作</b><br>
    1. カードを2枚めくり、色と形が同じならペア成立で消える。違うなら元に戻る。<br>
    2. 場所と色・形を覚えて、できるだけ少ない手数・短い時間で全ペアを揃えよう。<br>
    3. 手配は毎回ランダム。ベストタイムと最少手数はこのブラウザに保存される。
  </div>

  <div class="overlay" id="overlay"><div>
    <h2 id="ovTitle">クリア！</h2>
    <p id="ovText"></p>
    <button class="primary" id="ovRestart">もう一度やる</button>
  </div></div>
</main>
<script>
const $ = id=>document.getElementById(id);
const grid=$('grid');
const SHAPES = ['★','●','▲','◆','✕','♡','☾','☀','✦','✚','⍟','♠','♣','♦','♥','▷','◁','⚡'];
const COLORS = [
  '#f87171','#fbbf24','#4ade80','#22d3ee','#818cf8','#c084fc','#f472b6','#fb923c',
  '#a78bfa','#34d399','#60a5fa','#f43f5e','#eab308','#10b981','#3b82f6','#a855f7',
  '#ec4899','#f97316','#84cc16','#06b6d4','#6366f1','#f43f5e'
];

let sizeKey='4';      // '4','6','9'  (4x4, 6x4, 6x6)
let cols=4, rows=4;
let cards=[];         // {id, shape, color, matched, el}
let flipped=[];
let locked=false;
let matchedCount=0;
let moves=0;
let startTime=null, timer=null;
let firstMove=true;

const SIZE_SPECS = {4:{c:4,r:4,pairs:8}, 6:{c:6,r:4,pairs:12}, 9:{c:6,r:6,pairs:18}};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function newGame(){
  const spec = SIZE_SPECS[sizeKey]; cols=spec.c; rows=spec.r;
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cols<=4?72:58}px)`;
  grid.innerHTML='';
  const pool = SHAPES.slice().sort(()=>Math.random()-0.5).slice(0,spec.pairs);
  const colors = COLORS.slice().sort(()=>Math.random()-0.5).slice(0,spec.pairs);
  const items=[];
  pool.forEach((s,i)=>{
    const c=colors[i];
    items.push({shape:s,color:c},{shape:s,color:c});
  });
  shuffle(items);
  cards=[]; flipped=[]; matchedCount=0; moves=0; firstMove=true; locked=false;
  $('moves').textContent='0'; $('pairs').textContent='0 / '+spec.pairs; $('time').textContent='0.0s';
  $('msg').textContent='カードをめくろう'; $('msg').className='msg';
  $('overlay').hidden=true;
  if(timer) clearInterval(timer); startTime=null;
  items.forEach((it,idx)=>{
    const wrap=document.createElement('div'); wrap.className='cardwrap';
    const card=document.createElement('div'); card.className='card';
    const inner=document.createElement('div'); inner.className='inner';
    inner.textContent=it.shape; inner.style.color=it.color;
    card.appendChild(inner); wrap.appendChild(card); grid.appendChild(wrap);
    const data={id:idx, shape:it.shape, color:it.color, matched:false, el:card, wrap};
    cards.push(data);
    card.addEventListener('click', ()=>flip(data));
  });
  renderBest();
}
function renderBest(){
  const key='mem_best_'+sizeKey;
  const stored = localStorage.getItem(key);
  if(stored){
    const {time,moves}=JSON.parse(stored);
    $('best').textContent = time.toFixed(1)+'s';
    $('bestMoves').textContent = moves+'手';
  } else { $('best').textContent='—'; $('bestMoves').textContent='—'; }
}
function flip(c){
  if(locked || c.matched || flipped.includes(c)) return;
  c.el.classList.add('open');
  c.el.setAttribute('aria-checked','true');
  flipped.push(c);
  if(firstMove){ firstMove=false; startTime=Date.now(); timer=setInterval(()=>{$('time').textContent=((Date.now()-startTime)/1000).toFixed(1)+'s';},100); }
  if(flipped.length===2){
    moves++; $('moves').textContent=moves;
    locked=true;
    const [a,b]=flipped;
    const ok = a.shape===b.shape && a.color===b.color;
    if(ok){
      setTimeout(()=>{ a.matched=b.matched=true; a.el.classList.add('match'); b.el.classList.add('match'); matchedCount+=2; flipped=[]; locked=false; $('pairs').textContent=matchedCount/2+' / '+SIZE_SPECS[sizeKey].pairs; $('msg').textContent='ペア成立！'; $('msg').className='msg ok'; if(matchedCount===SIZE_SPECS[sizeKey].pairs*2) endGame(); },600);
    } else {
      setTimeout(()=>{ a.el.classList.remove('open'); b.el.classList.remove('open'); a.el.removeAttribute('aria-checked'); b.el.removeAttribute('aria-checked'); flipped=[]; locked=false; $('msg').textContent='ちがう。もう一度'; $('msg').className='msg bad'; },800);
    }
  }
}
function endGame(){
  clearInterval(timer);
  const time=((Date.now()-startTime)/1000).toFixed(1);
  const key='mem_best_'+sizeKey;
  let best=null; try{ best=JSON.parse(localStorage.getItem(key)||'null'); }catch{}
  let newBest=false;
  if(!best || time<best.time || (time===best.time && moves<best.moves)){ newBest=true; localStorage.setItem(key, JSON.stringify({time:parseFloat(time),moves})); }
  renderBest();
  $('ovText').textContent = moves+'手、'+time+'秒でクリア！'+(newBest?' 新記録！':'');
  $('ovTitle').textContent = newBest?'新記録！':'クリア！';
  $('overlay').hidden=false;
}
$('btnRetry').onclick=newGame;
$('btnNew').onclick=()=>{ sizeKey=$('sz4').classList.contains('active')?'4':$('sz6').classList.contains('active')?'6':'9'; newGame(); };
$('ovRestart').onclick=()=>{ $('overlay').hidden=true; newGame(); };
['sz4','sz6','sz9'].forEach(id=>{
  $(id).onclick=function(){
    document.querySelectorAll('.sizebar button').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    sizeKey = id==='sz4'?'4':id==='sz6'?'6':'9';
    newGame();
  };
});
newGame();
</script>
</body>
</html>
