<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神経衰弱</title>
  <style>
    :root { --bg:#0f1220; --ink:#f4f6fb; --muted:#a8b0c7; --card:#243056; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: var(--ink); background: var(--bg);
    }
    .wrap { width: min(440px, 100%); padding: 16px; text-align: center; }
    h1 { margin: 0 0 8px; }
    .meta { color: var(--muted); margin-bottom: 14px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card {
      aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--card);
      font-size: 32px; cursor: pointer; color: transparent;
    }
    .card.open, .card.done { color: inherit; background: #3a456c; }
    .card.done { background: #2f6b45; cursor: default; }
    button.reset, a { margin-top: 14px; }
    button.reset {
      border: 0; border-radius: 12px; padding: 10px 16px; background: #ffb703; color: #1b1404; font-weight: 700; cursor: pointer;
    }
    a { color: #7bd389; display: inline-block; margin-left: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>神経衰弱</h1>
    <div class="meta">めくり <b id="moves">0</b>　ペア <b id="pairs">0</b> / 8</div>
    <div class="board" id="board"></div>
    <div>
      <button class="reset" id="reset" type="button">もう一度</button>
      <a href="../../index.html">もどる</a>
    </div>
  </div>
  <script>
    const icons = ["🍎","🍋","🍇","🍓","🌸","⭐","🐟","🍀"];
    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const pairsEl = document.getElementById("pairs");
    let open = [], lock = false, moves = 0, pairs = 0;

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }
    function start() {
      board.innerHTML = "";
      open = [];
      lock = false;
      moves = 0;
      pairs = 0;
      movesEl.textContent = "0";
      pairsEl.textContent = "0";
      shuffle(icons.concat(icons)).forEach(icon => {
        const btn = document.createElement("button");
        btn.className = "card";
        btn.type = "button";
        btn.dataset.icon = icon;
        btn.textContent = icon;
        btn.addEventListener("click", () => flip(btn));
        board.appendChild(btn);
      });
    }
    function flip(btn) {
      if (lock || btn.classList.contains("open") || btn.classList.contains("done")) return;
      btn.classList.add("open");
      open.push(btn);
      if (open.length < 2) return;
      moves += 1;
      movesEl.textContent = moves;
      const [a, b] = open;
      if (a.dataset.icon === b.dataset.icon) {
        a.classList.add("done");
        b.classList.add("done");
        pairs += 1;
        pairsEl.textContent = pairs;
        open = [];
        if (pairs === 8) setTimeout(() => alert("ぜんぶそろった！ めくり回数: " + moves), 180);
      } else {
        lock = true;
        setTimeout(() => {
          a.classList.remove("open");
          b.classList.remove("open");
          open = [];
          lock = false;
        }, 700);
      }
    }
    document.getElementById("reset").onclick = start;
    start();
  </script>
</body>
</html>
