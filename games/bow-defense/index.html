<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>弓のタワーディフェンス</title>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; overflow: hidden; }
    body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: #f4f7f2; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud {
      position: fixed; left: 16px; right: 16px; top: 12px;
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.45); z-index: 2;
    }
    a, button { pointer-events: auto; }
    a { color: #d7ffb8; }
    button {
      border: 0; border-radius: 12px; padding: 8px 12px; background: #ffb703; color: #1b1404; font-weight: 700; cursor: pointer;
    }
    #hint { font-size: 14px; color: #d5e6cf; }
  </style>
</head>
<body>
  <div class="hud">
    <div>ウェーブ <b id="wave">1</b>　袋 <b id="score">0</b>　城 <b id="hp">12</b><div id="hint">コインは左下の袋までドラッグ。</div></div>
    <div>
      <button id="up-bow" type="button">弓を強化</button>
      <button id="up-arrow" type="button">矢を強化</button>
      <button id="path" type="button">軌道を表示</button>
      <button id="again" type="button">はじめから</button>
      <a href="../../index.html">もどる</a>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const waveEl = document.getElementById("wave");
    const scoreEl = document.getElementById("score");
    const hpEl = document.getElementById("hp");
    const hintEl = document.getElementById("hint");
    let w = 1, h = 1, dpr = 1;
    let pointer = {x: 0, y: 0};
    let bolts = [], enemies = [], shots = [], pops = [], coins = [];
    let loaded = false, drawing = false, power = 0, aim = 0;
    let showPath = localStorage.getItem("bow-path") === "1";
    let purse = 0, castle = 12, wave = 1, spawnLeft = 0, spawnTimer = 0, restock = 0;
    let bowLv = 0, arrowLv = 0;
    let state = "play", drag = null, coinDrag = null;
    const bowCosts = [8, 18, 32];
    const arrowCosts = [6, 14, 26];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const sprites = {};
    ["bow", "bolt", "slime", "slime2"].forEach(name => {
      const img = new Image();
      img.src = "img/" + name + ".png";
      sprites[name] = img;
    });
    function bowPos() {
      return {x: w * 0.58, y: Math.min(h - 200, h * 0.68)};
    }
    function bagPos() { return {x: 86, y: h - 96}; }
    function pivot() {
      const b = bowPos();
      return {x: b.x, y: b.y - 18};
    }
    function updateBow(dt) {
      if (!drawing) {
        power += (0 - power) * Math.min(1, dt * 8);
        return;
      }
      const p = pivot();
      const dx = pointer.x - p.x;
      const dy = pointer.y - p.y;
      const wantPower = Math.max(0, Math.min(1, (dy - 16) / 150));
      power += (wantPower - power) * Math.min(1, dt * 12);
      const dead = 64;
      if (Math.abs(dx) > dead) {
        const shifted = dx - Math.sign(dx) * dead;
        const target = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, -shifted / 210));
        aim += (target - aim) * Math.min(1, dt * 7);
      }
    }
    function shotSpeed() {
      return (540 + bowLv * 120) + power * (720 + bowLv * 80);
    }
    function trajectory() {
      const p = pivot();
      const ang = -Math.PI / 2 + aim;
      const speed = shotSpeed() || (540 + bowLv * 120);
      let x = p.x + Math.cos(ang) * 54;
      let y = p.y + Math.sin(ang) * 54;
      let vx = Math.cos(ang) * speed;
      let vy = Math.sin(ang) * speed;
      const pts = [{x, y}];
      for (let i = 0; i < 36; i++) {
        x += vx * 0.045;
        y += vy * 0.045;
        vy += 240 * 0.045;
        pts.push({x, y});
        if (y > h - 20 || x < -20 || x > w + 20) break;
      }
      return pts;
    }
    function pathPoints() {
      const top = 78;
      const mid = h * 0.34;
      const low = Math.min(h * 0.56, bowPos().y - 70);
      return [
        {x: -30, y: top},
        {x: w * 0.78, y: top},
        {x: w * 0.78, y: mid},
        {x: w * 0.18, y: mid},
        {x: w * 0.18, y: low},
        {x: w * 0.86, y: low}
      ];
    }
    function pathInfo() {
      const pts = pathPoints();
      const lens = [];
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
        lens.push(len);
        total += len;
      }
      return {pts, lens, total};
    }
    function pointAt(dist) {
      const {pts, lens, total} = pathInfo();
      let left = Math.max(0, Math.min(dist, total));
      for (let i = 0; i < lens.length; i++) {
        if (left <= lens[i]) {
          const t = lens[i] ? left / lens[i] : 0;
          return {x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t};
        }
        left -= lens[i];
      }
      return {...pts[pts.length - 1]};
    }
    function rackBolts() {
      const b = bowPos();
      return bolts.map((bolt, i) => ({
        ...bolt,
        x: b.x + 150 + (i % 3) * 42,
        y: b.y - 20 + Math.floor(i / 3) * 42
      }));
    }
    function reset() {
      bolts = Array.from({length: 6}, (_, i) => ({id: i + 1}));
      enemies = []; shots = []; pops = []; coins = [];
      loaded = false; drawing = false; power = 0; aim = 0; drag = null; coinDrag = null;
      purse = 0; castle = 12; wave = 1; bowLv = 0; arrowLv = 0;
      spawnLeft = 7; spawnTimer = 0.7; restock = 0; state = "play";
      sync();
    }
    function costText() {
      const bow = bowLv >= bowCosts.length ? "最大" : bowCosts[bowLv] + "枚";
      const arrow = arrowLv >= arrowCosts.length ? "最大" : arrowCosts[arrowLv] + "枚";
      document.getElementById("up-bow").textContent = "弓を強化 " + bow;
      document.getElementById("up-arrow").textContent = "矢を強化 " + arrow;
    }
    function sync() {
      waveEl.textContent = wave;
      scoreEl.textContent = purse;
      hpEl.textContent = castle;
      costText();
      document.getElementById("path").textContent = showPath ? "軌道を消す" : "軌道を表示";
      hintEl.textContent = "下側を左へ動かすと照準は右。右へ動かすと照準は左。下に引いて離すと発射。";
    }
    function buy(kind) {
      const costs = kind === "bow" ? bowCosts : arrowCosts;
      const lv = kind === "bow" ? bowLv : arrowLv;
      if (lv >= costs.length || purse < costs[lv] || state !== "play") return;
      purse -= costs[lv];
      if (kind === "bow") bowLv += 1;
      else arrowLv += 1;
      sync();
    }
    function spawn() {
      const tough = wave > 3 && Math.random() < 0.34;
      enemies.push({
        dist: 0,
        r: tough ? 22 : 16,
        hp: (tough ? 4 : 2) + Math.floor(wave / 2),
        max: (tough ? 4 : 2) + Math.floor(wave / 2),
        speed: (tough ? 42 : 58) + wave * 3,
        color: tough ? "#79c0ea" : "#86d98a",
        score: tough ? 20 : 10
      });
    }
    function eventPos(ev) {
      const r = canvas.getBoundingClientRect();
      const s = ev.clientX !== undefined ? ev : (ev.touches && ev.touches[0]);
      if (!s) return pointer;
      return {x: s.clientX - r.left, y: s.clientY - r.top};
    }
    function onDown(ev) {
      pointer = eventPos(ev);
      if (state !== "play") return;
      if (canvas.setPointerCapture && ev.pointerId !== undefined) {
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
      const hitCoin = coins.find(c => Math.hypot(c.x - pointer.x, c.y - pointer.y) < 28);
      if (hitCoin) { coinDrag = hitCoin; ev.preventDefault(); return; }
      const hit = rackBolts().find(b => Math.hypot(b.x - pointer.x, b.y - pointer.y) < 42);
      if (hit && !loaded) {
        drag = hit;
        ev.preventDefault();
        return;
      }
      const p = pivot();
      if (drag && Math.hypot(pointer.x - p.x, pointer.y - p.y) < 120) return;
      if (!drag && !coinDrag && loaded && Math.hypot(pointer.x - p.x, pointer.y - p.y) < 130) {
        drawing = true;
        ev.preventDefault();
      }
    }
    function onMove(ev) {
      pointer = eventPos(ev);
      if (coinDrag) {
        coinDrag.x = pointer.x;
        coinDrag.y = pointer.y;
        ev.preventDefault();
        return;
      }
      if (drag) ev.preventDefault();
    }
    function loadFromDrag() {
      if (!drag || loaded) return;
      loaded = true;
      bolts = bolts.filter(item => item.id !== drag.id);
      drag = null;
      sync();
    }
    function onUp(ev) {
      if (ev && ev.clientX !== undefined) pointer = eventPos(ev);
      if (coinDrag) {
        const bag = bagPos();
        if (Math.hypot(pointer.x - bag.x, pointer.y - bag.y) < 70) {
          purse += coinDrag.value;
          coins = coins.filter(c => c.id !== coinDrag.id);
        }
        coinDrag = null;
        sync();
      } else if (drag) {
        const p = pivot();
        const onBow = Math.hypot(pointer.x - p.x, pointer.y - p.y) < 120;
        if (onBow) loadFromDrag();
        else sync();
      } else if (drawing) {
        if (power > 0.22) fire();
        drawing = false;
        power = 0;
      }
    }
    function fire() {
      const p = pivot();
      const ang = -Math.PI / 2 + aim;
      const speed = shotSpeed();
      shots.push({
        x: p.x + Math.cos(ang) * 54,
        y: p.y + Math.sin(ang) * 54,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: 2.2,
        damage: 1 + arrowLv
      });
      loaded = false;
      sync();
    }
    canvas.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.getElementById("again").onclick = reset;
    document.getElementById("up-bow").onclick = () => buy("bow");
    document.getElementById("up-arrow").onclick = () => buy("arrow");
    document.getElementById("path").onclick = () => {
      showPath = !showPath;
      localStorage.setItem("bow-path", showPath ? "1" : "0");
      sync();
    };
    window.addEventListener("resize", resize);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "play") {
        updateBow(dt);
        update(dt);
      }
      draw();
      requestAnimationFrame(frame);
    }
    function update(dt) {
      if (bolts.length < 6) {
        restock -= dt;
        if (restock <= 0) {
          bolts.push({id: Date.now() + Math.random()});
          restock = 0.9;
        }
      }
      const {total} = pathInfo();
      if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnLeft -= 1;
          spawnTimer = Math.max(0.4, 1.05 - wave * 0.06);
        }
      } else if (!enemies.length && !shots.length) {
        if (wave >= 8) state = "win";
        else {
          wave += 1;
          spawnLeft = 6 + wave;
          spawnTimer = 1.2;
          sync();
        }
      }
      enemies.forEach(e => e.dist += e.speed * dt);
      const leaked = enemies.filter(e => e.dist >= total);
      if (leaked.length) {
        castle -= leaked.length;
        enemies = enemies.filter(e => e.dist < total);
        sync();
        if (castle <= 0) { castle = 0; state = "lose"; sync(); }
      }
      shots.forEach(s => {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 240 * dt;
        s.life -= dt;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          const p = pointAt(e.dist);
          if (Math.hypot(p.x - s.x, p.y - s.y) < e.r + 7) {
            e.hp -= s.damage;
            s.life = 0;
            pops.push({x: p.x, y: p.y, life: 0.28});
            if (e.hp <= 0) {
              coins.push({id: Date.now() + Math.random(), x: p.x, y: p.y, value: e.score >= 20 ? 4 : 2});
            }
          }
        }
      });
      shots = shots.filter(s => s.life > 0 && s.x > -40 && s.x < w + 40 && s.y < h + 40);
      const before = enemies.length;
      enemies = enemies.filter(e => e.hp > 0);
      if (enemies.length !== before) sync();
      pops.forEach(p => p.life -= dt);
      pops = pops.filter(p => p.life > 0);
    }
    function drawPath() {
      const {pts} = pathInfo();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#c8b27a";
      ctx.lineWidth = 42;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
      ctx.strokeStyle = "#efe0b8";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 12]);
      ctx.stroke();
      ctx.setLineDash([]);
      const gate = pts[pts.length - 1];
      ctx.fillStyle = "#d7c08a";
      ctx.fillRect(gate.x - 8, gate.y - 34, 46, 68);
      ctx.fillStyle = "#8d5a34";
      ctx.fillRect(gate.x + 6, gate.y - 8, 18, 42);
      ctx.fillStyle = "#f4f7f2";
      ctx.font = "14px sans-serif";
      ctx.fillText("城", gate.x + 8, gate.y - 42);
    }
    function drawSprite(img, x, y, dw, dh, rot) {
      if (!img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
      return true;
    }
    function drawBow() {
      const p = pivot();
      const pull = power * 36;
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 96, Math.PI, 0);
      ctx.stroke();
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(aim);
      if (sprites.bow.complete && sprites.bow.naturalWidth) {
        ctx.drawImage(sprites.bow, -100, -78, 200, 286);
      } else {
        ctx.fillStyle = "#6a4328";
        ctx.fillRect(-14, -20, 28, 90);
      }
      if (loaded || drawing) {
        if (sprites.bolt.complete && sprites.bolt.naturalWidth) ctx.drawImage(sprites.bolt, -12, -92 + pull, 24, 130);
      }
      ctx.restore();
      ctx.fillStyle = "rgba(8,16,12,.6)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffe08a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.moveTo(p.x - 24, p.y);
      ctx.lineTo(p.x + 24, p.y);
      ctx.moveTo(p.x, p.y - 24);
      ctx.lineTo(p.x, p.y + 24);
      ctx.stroke();
      if (showPath && loaded) {
        const pts = trajectory();
        ctx.strokeStyle = "rgba(255, 220, 120, .8)";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.setLineDash([]);
        pts.forEach((p, i) => {
          if (i % 4) return;
          ctx.fillStyle = "rgba(255, 220, 120, .9)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }
    function drawBolt(x, y) {
      if (!drawSprite(sprites.bolt, x, y, 22, 78, 0)) {
        ctx.strokeStyle = "#f0d48a";
        ctx.beginPath();
        ctx.moveTo(x, y + 16);
        ctx.lineTo(x, y - 16);
        ctx.stroke();
      }
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#16364a");
      sky.addColorStop(1, "#1d4634");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      drawPath();
      const b = bowPos();
      const bag = bagPos();
      ctx.fillStyle = "#8a5a32";
      ctx.beginPath();
      ctx.ellipse(bag.x, bag.y + 8, 42, 30, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#c9844a";
      ctx.fillRect(bag.x - 28, bag.y - 18, 56, 16);
      ctx.fillStyle = "#f4f7f2";
      ctx.font = "14px sans-serif";
      ctx.fillText("袋", bag.x - 8, bag.y + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(b.x + 124, b.y - 58, 150, 112);
      rackBolts().forEach(bolt => {
        ctx.fillStyle = "rgba(255,255,255,.16)";
        ctx.beginPath();
        ctx.arc(bolt.x, bolt.y, 20, 0, Math.PI * 2);
        ctx.fill();
        drawBolt(bolt.x, bolt.y);
      });
      enemies.forEach(e => {
        const p = pointAt(e.dist);
        const img = e.color === "#79c0ea" ? sprites.slime2 : sprites.slime;
        if (!drawSprite(img, p.x, p.y, e.r * 3.2, e.r * 3.2, 0)) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#203828";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28, 4);
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28 * Math.max(0, e.hp / e.max), 4);
      });
      shots.forEach(s => {
        const ang = Math.atan2(s.vy, s.vx) + Math.PI / 2;
        if (!drawSprite(sprites.bolt, s.x, s.y, 24, 92, ang)) {
          ctx.strokeStyle = "#f4e2b0";
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
          ctx.stroke();
        }
      });
      pops.forEach(p => {
        ctx.fillStyle = `rgba(255, 224, 130, ${p.life * 3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });
      coins.forEach(c => {
        if (c === coinDrag) return;
        ctx.fillStyle = "#f0c14a";
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#8a5a12";
        ctx.font = "bold 14px sans-serif";
        ctx.fillText(c.value, c.x - 4, c.y + 5);
      });
      if (coinDrag) {
        ctx.fillStyle = "#ffe08a";
        ctx.beginPath();
        ctx.arc(coinDrag.x, coinDrag.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#8a5a12";
        ctx.fillText(coinDrag.value, coinDrag.x - 4, coinDrag.y + 5);
      }
      if (drag) drawBolt(pointer.x, pointer.y);
      drawBow();
      if (state !== "play") {
        ctx.fillStyle = "rgba(8,16,12,.6)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(state === "win" ? "守りきった！" : "城まで来てしまった", w / 2, h / 2);
        ctx.font = "18px sans-serif";
        ctx.fillText("「はじめから」でもう一度", w / 2, h / 2 + 36);
        ctx.textAlign = "left";
      }
    }
    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
