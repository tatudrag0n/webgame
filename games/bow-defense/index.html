<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>弓のタワーディフェンス | 城を守り続けろ</title>
  <meta name="description" content="自分で矢を込めてクロスボウを引き、道を進むスライムから城を守るブラウザゲーム。">
  <style>
    html, body { margin: 0; height: 100%; background: #102018; overflow: hidden; }
    body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: #f4f7f2; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud, .hintbar, .actions { position: fixed; z-index: 2; pointer-events: none; }
    .hud { left: 12px; right: 12px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { pointer-events: none; background: rgba(8,16,12,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 6px 10px; min-width: 64px; }
    .stat span { display: block; font-size: 11px; color: #c9d7c4; }
    .stat b { font-size: 16px; }
    .castle { min-width: 120px; }
    .bar { height: 8px; margin-top: 6px; background: #203028; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 60%; background: #8dce7a; }
    .actions { top: 10px; right: 12px; display: flex; gap: 6px; }
    .hintbar { left: 12px; right: 12px; bottom: 12px; text-align: center; }
    #hint { display: inline-block; pointer-events: none; background: rgba(8,16,12,.72); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
    a, button { pointer-events: auto; }
    a { color: #d7ffb8; align-self: center; text-decoration: none; }
    button { border: 0; border-radius: 12px; padding: 8px 12px; background: #ffb703; color: #1b1404; font-weight: 700; cursor: pointer; }
    .shop, #board-box { display: none; position: fixed; right: 12px; top: 58px; z-index: 4; width: min(340px, calc(100vw - 24px)); background: rgba(10,16,14,.92); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px; pointer-events: auto; }
    .shop.open { display: grid; gap: 6px; }
    .shop button, #board-box button { width: 100%; text-align: left; background: #243056; color: #f4f7f2; }
    #board-box ol { margin: 8px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat">ウェーブ<span><b id="wave">1</b></span></div>
    <div class="stat">得点<span><b id="points">0</b></span></div>
    <div class="stat">記録<span><b id="best">0</b></span></div>
    <div class="stat">袋<span><b id="score">0</b></span></div>
    <div class="stat castle">城 <b id="hp">12</b><div class="bar"><i id="hp-bar"></i></div></div>
  </div>
  <div class="actions">
    <button id="shop-toggle" type="button">強化</button>
    <button id="sound" type="button">音</button>
    <button id="board" type="button">順位</button>
    <button id="again" type="button">はじめから</button>
    <a href="../../index.html">もどる</a>
  </div>
  <div class="shop" id="shop">
    <b>強化</b>
    <button id="up-tip" type="button">鋼の矢じり</button>
    <button id="up-string" type="button">鋼の弦</button>
    <button id="up-count" type="button">追加の矢</button>
    <button id="up-feather" type="button">軽い矢羽</button>
    <button id="up-quiver" type="button">予備の矢筒</button>
    <button id="up-auto" type="button">自動装填</button>
    <button id="up-repair" type="button">城の修理</button>
    <button id="path" type="button">軌道を表示</button>
  </div>
  <div class="hintbar"><div id="hint">コインは袋までドラッグ。</div></div>
  <canvas id="c"></canvas>
  <div id="board-box">
    <b>順位表</b>
    <div id="board-note">このブラウザの記録</div>
    <ol id="board-list"></ol>
    <button id="board-close" type="button">閉じる</button>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const waveEl = document.getElementById("wave");
    const scoreEl = document.getElementById("score");
    const pointsEl = document.getElementById("points");
    const bestEl = document.getElementById("best");
    const hpEl = document.getElementById("hp");
    const hintEl = document.getElementById("hint");
    let w = 1, h = 1, dpr = 1;
    let pointer = {x: 0, y: 0};
    let bolts = [], enemies = [], shots = [], pops = [], coins = [];
    let loaded = false, drawing = false, power = 0, aim = 0;
    let showPath = localStorage.getItem("bow-path") === "1";
    let purse = 0, points = 0, best = Number(localStorage.getItem("bow-best") || 0), castle = 12, wave = 1, spawnLeft = 0, spawnTimer = 0, restock = 0;
    let bowLv = 0, arrowLv = 0, countLv = 0, featherLv = 0, quiverLv = 0, autoReload = false;
    let state = "ready", drag = null, coinDrag = null, banner = "";
    let soundOn = localStorage.getItem("bow-sound") !== "0";
    let audioCtx = null;
    const bowCosts = [8, 18, 32];
    const arrowCosts = [6, 14, 26];
    const countCosts = [12, 24];
    const featherCosts = [8, 16];
    const quiverCosts = [8, 16];
    const autoCost = 20;
    const repairCost = 10;

    function beep(freq, dur, type) {
      if (!soundOn) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "triangle";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    }
    function loadBoard() {
      try { return JSON.parse(localStorage.getItem("bow-board") || "[]"); }
      catch (e) { return []; }
    }
    function saveScore() {
      const name = (prompt("順位表に残す名前（8文字まで）", "弓士") || "弓士").replace(/\s+/g, "").slice(0, 8) || "弓士";
      const board = loadBoard();
      board.push({name, score: points, wave, at: Date.now()});
      board.sort((a, b) => b.score - a.score);
      localStorage.setItem("bow-board", JSON.stringify(board.slice(0, 8)));
      showBoard();
    }
    function showBoard() {
      const list = document.getElementById("board-list");
      const board = loadBoard();
      list.innerHTML = board.length ? board.map(row => `<li>${row.name}　${row.score}点　W${row.wave}</li>`).join("") : "<li>まだ記録がありません</li>";
      document.getElementById("board-box").style.display = "block";
    }
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const sprites = {};
    ["bow", "bolt", "slime", "slime2", "coin", "bag"].forEach(name => {
      const img = new Image();
      img.src = "img/" + name + ".png";
      sprites[name] = img;
    });
    sprites.bg = new Image();
    sprites.bg.src = "img/bg.jpg";
    function bowPos() {
      return {x: w * 0.58, y: Math.min(h - 200, h * 0.68)};
    }
    function bagPos() { return {x: 78, y: Math.max(150, h * 0.38)}; }
    function pivot() {
      const b = bowPos();
      return {x: b.x, y: b.y - 18};
    }
    function updateBow(dt) {
      if (!drawing) {
        power += (0 - power) * Math.min(1, dt * 8);
        return;
      }
      const p = pivot();
      const dx = pointer.x - p.x;
      const dy = pointer.y - p.y;
      const wantPower = Math.max(0, Math.min(1, (dy - 16) / 150));
      power += (wantPower - power) * Math.min(1, dt * 12);
      const dead = 18;
      if (Math.abs(dx) > dead) {
        const shifted = dx - Math.sign(dx) * dead;
        const target = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, -shifted / 95));
        aim += (target - aim) * Math.min(1, dt * 16);
      }
    }
    function gravity() { return 240 - featherLv * 80; }
    function shotSpeed() {
      return (540 + bowLv * 140) + power * (720 + bowLv * 90);
    }
    function trajectory() {
      const p = pivot();
      const ang = -Math.PI / 2 + aim;
      const speed = shotSpeed() || (540 + bowLv * 120);
      let x = p.x + Math.cos(ang) * 54;
      let y = p.y + Math.sin(ang) * 54;
      let vx = Math.cos(ang) * speed;
      let vy = Math.sin(ang) * speed;
      const pts = [{x, y}];
      for (let i = 0; i < 36; i++) {
        x += vx * 0.045;
        y += vy * 0.045;
        vy += gravity() * 0.045;
        pts.push({x, y});
        if (y > h - 20 || x < -20 || x > w + 20) break;
      }
      return pts;
    }
    function pathPoints() {
      const top = 78;
      const mid = h * 0.34;
      const low = Math.min(h * 0.56, bowPos().y - 70);
      return [
        {x: -30, y: top},
        {x: w * 0.78, y: top},
        {x: w * 0.78, y: mid},
        {x: w * 0.18, y: mid},
        {x: w * 0.18, y: low},
        {x: w * 0.86, y: low}
      ];
    }
    function pathInfo() {
      const pts = pathPoints();
      const lens = [];
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
        lens.push(len);
        total += len;
      }
      return {pts, lens, total};
    }
    function pointAt(dist) {
      const {pts, lens, total} = pathInfo();
      let left = Math.max(0, Math.min(dist, total));
      for (let i = 0; i < lens.length; i++) {
        if (left <= lens[i]) {
          const t = lens[i] ? left / lens[i] : 0;
          return {x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t};
        }
        left -= lens[i];
      }
      return {...pts[pts.length - 1]};
    }
    function rackBolts() {
      const b = bowPos();
      return bolts.map((bolt, i) => ({
        ...bolt,
        x: b.x + 150 + (i % 3) * 42,
        y: b.y - 20 + Math.floor(i / 3) * 42
      }));
    }
    function reset() {
      bolts = Array.from({length: 6}, (_, i) => ({id: i + 1}));
      enemies = []; shots = []; pops = []; coins = [];
      loaded = false; drawing = false; power = 0; aim = 0; drag = null; coinDrag = null;
      purse = 0; points = 0; castle = 12; wave = 1; bowLv = 0; arrowLv = 0; countLv = 0; featherLv = 0; quiverLv = 0; autoReload = false;
      spawnLeft = 8; spawnTimer = 0.8; restock = 0; state = "play"; banner = "ウェーブ 1";
      sync();
    }
    function addPoints(n) {
      points += n;
      if (points > best) {
        best = points;
        localStorage.setItem("bow-best", String(best));
      }
    }
    function costText() {
      const price = (lv, costs) => lv >= costs.length ? "最大" : costs[lv] + "枚";
      document.getElementById("up-tip").textContent = "鋼の矢じり " + price(arrowLv, arrowCosts) + " / ダメージ+" + (1 + arrowLv);
      document.getElementById("up-string").textContent = "鋼の弦 " + price(bowLv, bowCosts) + " / 初速アップ";
      document.getElementById("up-count").textContent = "追加の矢 " + price(countLv, countCosts) + " / 同時" + (1 + countLv) + "本";
      document.getElementById("up-feather").textContent = "軽い矢羽 " + price(featherLv, featherCosts) + " / 落下を減らす";
      document.getElementById("up-quiver").textContent = "予備の矢筒 " + price(quiverLv, quiverCosts) + " / 補充が速い";
      document.getElementById("up-auto").textContent = autoReload ? "自動装填 済み" : "自動装填 " + autoCost + "枚 / 次の矢を自動で込める";
      document.getElementById("up-repair").textContent = "城の修理 " + repairCost + "枚 / 城+4";
    }
    function sync() {
      waveEl.textContent = wave;
      pointsEl.textContent = points;
      bestEl.textContent = best;
      scoreEl.textContent = purse;
      hpEl.textContent = castle;
      document.getElementById("hp-bar").style.width = Math.max(0, castle / 20 * 100) + "%";
      costText();
      document.getElementById("path").textContent = showPath ? "軌道を消す" : "軌道を表示";
      hintEl.textContent = drag
        ? "矢を十字の近くで離すと装填。タップでも選べる。"
        : coinDrag
        ? "袋の近くで離すと入る。"
        : loaded
        ? "下側を左へ動かすと照準は右。下へ引いて離すと発射。"
        : "右の矢をタップするか、十字までドラッグ。";
    }
    function tryAutoLoad() {
      if (!autoReload || loaded || !bolts.length) return;
      bolts.pop();
      loaded = true;
    }
    function buy(kind) {
      if (state !== "play") return;
      if (kind === "auto") {
        if (autoReload || purse < autoCost) return;
        purse -= autoCost;
        autoReload = true;
        tryAutoLoad();
        sync();
        return;
      }
      if (kind === "repair") {
        if (purse < repairCost || castle >= 20) return;
        purse -= repairCost;
        castle = Math.min(20, castle + 4);
        sync();
        return;
      }
      const table = {
        string: [bowCosts, bowLv],
        tip: [arrowCosts, arrowLv],
        count: [countCosts, countLv],
        feather: [featherCosts, featherLv],
        quiver: [quiverCosts, quiverLv]
      };
      const costs = table[kind][0];
      const lv = table[kind][1];
      if (lv >= costs.length || purse < costs[lv]) return;
      purse -= costs[lv];
      if (kind === "string") bowLv += 1;
      else if (kind === "tip") arrowLv += 1;
      else if (kind === "count") countLv += 1;
      else if (kind === "feather") featherLv += 1;
      else quiverLv += 1;
      sync();
    }
    function spawn() {
      const roll = Math.random();
      const fast = roll < 0.28;
      const tough = !fast && roll < 0.55;
      const boss = wave % 5 === 0 && roll < 0.2;
      enemies.push({
        dist: 0,
        r: boss ? 30 : tough ? 22 : fast ? 13 : 16,
        hp: (boss ? 10 : tough ? 4 : fast ? 1 : 2) + Math.floor(wave / 2),
        max: (boss ? 10 : tough ? 4 : fast ? 1 : 2) + Math.floor(wave / 2),
        speed: (boss ? 30 : tough ? 40 : fast ? 78 : 56) + wave * 2,
        color: boss ? "#f0c14a" : tough ? "#79c0ea" : "#86d98a",
        kind: boss ? "boss" : tough ? "tough" : "small",
        score: boss ? 40 : tough ? 20 : 10
      });
    }
    function eventPos(ev) {
      const r = canvas.getBoundingClientRect();
      const s = ev.clientX !== undefined ? ev : (ev.touches && ev.touches[0]);
      if (!s) return pointer;
      return {x: s.clientX - r.left, y: s.clientY - r.top};
    }
    function onDown(ev) {
      pointer = eventPos(ev);
      if (state !== "play") return;
      if (canvas.setPointerCapture && ev.pointerId !== undefined) {
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
      const hitCoin = coins.find(c => Math.hypot(c.x - pointer.x, c.y - pointer.y) < 40);
      if (hitCoin) { coinDrag = hitCoin; ev.preventDefault(); return; }
      const hit = rackBolts().find(b => Math.hypot(b.x - pointer.x, b.y - pointer.y) < 54);
      if (hit && !loaded) {
        drag = hit;
        ev.preventDefault();
        return;
      }
      const p = pivot();
      if (!drag && !coinDrag && !loaded && selectedBolt && Math.hypot(pointer.x - p.x, pointer.y - p.y) < 150) {
        drag = selectedBolt;
        loadFromDrag();
        ev.preventDefault();
        return;
      }
      if (!drag && !coinDrag && loaded && Math.hypot(pointer.x - p.x, pointer.y - p.y) < 160) {
        drawing = true;
        ev.preventDefault();
      }
    }
    function onMove(ev) {
      pointer = eventPos(ev);
      if (coinDrag) {
        coinDrag.x = pointer.x;
        coinDrag.y = pointer.y;
        const bag = bagPos();
        if (Math.hypot(pointer.x - bag.x, pointer.y - bag.y) < 46) {
          coinDrag.x = bag.x;
          coinDrag.y = bag.y;
        }
        ev.preventDefault();
        return;
      }
      if (drag) {
        ev.preventDefault();
        sync();
      }
    }
    let selectedBolt = null;
    function loadFromDrag() {
      if (!drag || loaded) return;
      loaded = true;
      bolts = bolts.filter(item => item.id !== drag.id);
      selectedBolt = null;
      drag = null;
      beep(300, 0.08, "triangle");
      sync();
    }
    function onUp(ev) {
      if (ev && ev.clientX !== undefined) pointer = eventPos(ev);
      if (coinDrag) {
        const bag = bagPos();
        if (Math.hypot(pointer.x - bag.x, pointer.y - bag.y) < 100) {
          purse += coinDrag.value;
          coins = coins.filter(c => c.id !== coinDrag.id);
          beep(720, 0.12, "square");
        }
        coinDrag = null;
        sync();
      } else if (drag) {
        const p = pivot();
        const moved = Math.hypot(pointer.x - drag.x, pointer.y - drag.y);
        const onBow = Math.hypot(pointer.x - p.x, pointer.y - p.y) < 150;
        if (onBow) loadFromDrag();
        else if (moved < 12) selectedBolt = drag;
        drag = null;
        sync();
      } else if (drawing) {
        if (power > 0.22) fire();
        drawing = false;
        power = 0;
      }
    }
    function fire() {
      const p = pivot();
      const ang = -Math.PI / 2 + aim;
      const speed = shotSpeed();
      const count = 1 + countLv;
      for (let i = 0; i < count; i++) {
        const spread = (i - (count - 1) / 2) * 0.12;
        const ang = -Math.PI / 2 + aim + spread;
        shots.push({
          x: p.x + Math.cos(ang) * 54,
          y: p.y + Math.sin(ang) * 54,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          life: 2.2,
          damage: 1 + arrowLv
        });
      }
      loaded = false;
      beep(420, 0.08, "triangle");
      tryAutoLoad();
      sync();
    }
    canvas.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.getElementById("again").onclick = reset;
    document.getElementById("sound").onclick = () => {
      soundOn = !soundOn;
      localStorage.setItem("bow-sound", soundOn ? "1" : "0");
      document.getElementById("sound").textContent = soundOn ? "音" : "消";
      if (soundOn) beep(520, 0.1, "triangle");
    };
    document.getElementById("sound").textContent = soundOn ? "音オン" : "音オフ";
    document.getElementById("board").onclick = showBoard;
    document.getElementById("shop-toggle").onclick = () => document.getElementById("shop").classList.toggle("open");
    document.getElementById("board-close").onclick = () => { document.getElementById("board-box").style.display = "none"; };
    document.getElementById("up-string").onclick = () => buy("string");
    document.getElementById("up-tip").onclick = () => buy("tip");
    document.getElementById("up-count").onclick = () => buy("count");
    document.getElementById("up-feather").onclick = () => buy("feather");
    document.getElementById("up-quiver").onclick = () => buy("quiver");
    document.getElementById("up-auto").onclick = () => buy("auto");
    document.getElementById("up-repair").onclick = () => buy("repair");
    document.getElementById("path").onclick = () => {
      showPath = !showPath;
      localStorage.setItem("bow-path", showPath ? "1" : "0");
      sync();
    };
    window.addEventListener("resize", resize);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "play") {
        updateBow(dt);
        update(dt);
      }
      draw();
      requestAnimationFrame(frame);
    }
    function update(dt) {
      if (bolts.length < 6) {
        restock -= dt;
        if (restock <= 0) {
          bolts.push({id: Date.now() + Math.random()});
          restock = Math.max(0.35, 0.9 - quiverLv * 0.25);
        }
      }
      const {total} = pathInfo();
      if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnLeft -= 1;
          spawnTimer = Math.max(0.4, 1.05 - wave * 0.06);
        }
      } else if (!enemies.length && !shots.length) {
        wave += 1;
        spawnLeft = 6 + Math.min(wave, 18);
        spawnTimer = 1.1;
        purse += 4;
        addPoints(25);
        banner = "ウェーブ " + wave + "　ボーナス 4枚";
        beep(640, 0.16, "triangle");
        sync();
      }
      enemies.forEach(e => e.dist += e.speed * dt);
      const leaked = enemies.filter(e => e.dist >= total);
      if (leaked.length) {
        castle -= leaked.length;
        enemies = enemies.filter(e => e.dist < total);
        sync();
        if (castle <= 0) { castle = 0; state = "lose"; beep(140, 0.35, "sawtooth"); sync(); saveScore(); }
      }
      shots.forEach(s => {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += gravity() * dt;
        s.life -= dt;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          const p = pointAt(e.dist);
          if (Math.hypot(p.x - s.x, p.y - s.y) < e.r + 7) {
            e.hp -= s.damage;
            s.life = 0;
            pops.push({x: p.x, y: p.y, life: 0.28});
            beep(560, 0.05, "square");
            if (e.hp <= 0) {
              addPoints(e.score);
              coins.push({id: Date.now() + Math.random(), x: p.x, y: p.y, value: e.kind === "boss" ? 6 : e.score >= 20 ? 4 : 2});
            }
          }
        }
      });
      shots = shots.filter(s => s.life > 0 && s.x > -40 && s.x < w + 40 && s.y < h + 40);
      const before = enemies.length;
      enemies = enemies.filter(e => e.hp > 0);
      if (enemies.length !== before) sync();
      pops.forEach(p => p.life -= dt);
      pops = pops.filter(p => p.life > 0);
    }
    function drawPath() {
      const {pts} = pathInfo();
      const stroke = (width, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
      };
      stroke(58, "#5c4630");
      stroke(46, "#a67c52");
      stroke(30, "#c4a06a");
      ctx.setLineDash([16, 14]);
      stroke(4, "rgba(92,70,40,.55)");
      ctx.setLineDash([]);
      const gate = pts[pts.length - 1];
      ctx.fillStyle = "#d9d3c7";
      ctx.fillRect(gate.x - 6, gate.y - 40, 52, 74);
      ctx.fillStyle = "#8d5a34";
      ctx.fillRect(gate.x + 10, gate.y - 6, 18, 40);
      ctx.fillStyle = "#f4f7f2";
      ctx.font = "14px sans-serif";
      ctx.fillText("城", gate.x + 12, gate.y - 48);
    }
    function drawSprite(img, x, y, dw, dh, rot) {
      if (!img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
      return true;
    }
    function drawBow() {
      const p = pivot();
      const pull = power * 36;
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 96, Math.PI, 0);
      ctx.stroke();
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(aim);
      if (sprites.bow.complete && sprites.bow.naturalWidth) {
        ctx.drawImage(sprites.bow, -100, -78, 200, 286);
      } else {
        ctx.fillStyle = "#6a4328";
        ctx.fillRect(-14, -20, 28, 90);
      }
      if (loaded || drawing) {
        if (sprites.bolt.complete && sprites.bolt.naturalWidth) ctx.drawImage(sprites.bolt, -12, -92 + pull, 24, 130);
      }
      ctx.restore();
      ctx.fillStyle = "rgba(8,16,12,.6)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffe08a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.moveTo(p.x - 24, p.y);
      ctx.lineTo(p.x + 24, p.y);
      ctx.moveTo(p.x, p.y + 24);
      ctx.lineTo(p.x, p.y - 24);
      ctx.stroke();
      if (loaded) {
        const ang = -Math.PI / 2 + aim;
        ctx.strokeStyle = "rgba(255,224,138,.75)";
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(ang) * 36, p.y + Math.sin(ang) * 36);
        ctx.lineTo(p.x + Math.cos(ang) * 130, p.y + Math.sin(ang) * 130);
        ctx.stroke();
      }
      ctx.fillStyle = "#203828";
      ctx.fillRect(p.x + 34, p.y - 6, 72, 8);
      ctx.fillStyle = "#ffb703";
      ctx.fillRect(p.x + 34, p.y - 6, 72 * power, 8);
      if (showPath && loaded) {
        const pts = trajectory();
        ctx.strokeStyle = "rgba(255, 220, 120, .8)";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 7]);
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.setLineDash([]);
        pts.forEach((p, i) => {
          if (i % 4) return;
          ctx.fillStyle = "rgba(255, 220, 120, .9)";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }
    function drawBolt(x, y) {
      if (!drawSprite(sprites.bolt, x, y, 22, 78, 0)) {
        ctx.strokeStyle = "#f0d48a";
        ctx.beginPath();
        ctx.moveTo(x, y + 16);
        ctx.lineTo(x, y - 16);
        ctx.stroke();
      }
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#16364a");
      sky.addColorStop(1, "#1d4634");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      if (sprites.bg.complete && sprites.bg.naturalWidth) ctx.drawImage(sprites.bg, 0, 0, w, h);
      drawPath();
      const b = bowPos();
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(b.x + 124, b.y - 58, 150, 112);
      rackBolts().forEach(bolt => {
        ctx.strokeStyle = selectedBolt && selectedBolt.id === bolt.id ? "#ffe08a" : "rgba(255,255,255,.16)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(bolt.x, bolt.y, 24, 0, Math.PI * 2);
        ctx.stroke();
        drawBolt(bolt.x, bolt.y);
      });
      if (drag) {
        const p = pivot();
        ctx.strokeStyle = Math.hypot(pointer.x - p.x, pointer.y - p.y) < 150 ? "#9dff7a" : "#ffe08a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 70, 0, Math.PI * 2);
        ctx.stroke();
      }
      enemies.forEach(e => {
        const p = pointAt(e.dist);
        const img = e.kind === "boss" ? sprites.slime2 : e.kind === "tough" ? sprites.slime2 : sprites.slime;
        if (!drawSprite(img, p.x, p.y, e.r * 3.2, e.r * 3.2, 0)) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#203828";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28, 4);
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28 * Math.max(0, e.hp / e.max), 4);
      });
      shots.forEach(s => {
        const ang = Math.atan2(s.vy, s.vx) + Math.PI / 2;
        if (!drawSprite(sprites.bolt, s.x, s.y, 24, 92, ang)) {
          ctx.strokeStyle = "#f4e2b0";
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
          ctx.stroke();
        }
      });
      pops.forEach(p => {
        ctx.fillStyle = `rgba(255, 224, 130, ${p.life * 3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });
      coins.forEach(c => {
        if (c === coinDrag) return;
        if (!drawSprite(sprites.coin, c.x, c.y, 36, 36, 0)) {
          ctx.fillStyle = "#f0c14a";
          ctx.beginPath();
          ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      if (coinDrag && !drawSprite(sprites.coin, coinDrag.x, coinDrag.y, 42, 42, 0)) {
        ctx.fillStyle = "#ffe08a";
        ctx.beginPath();
        ctx.arc(coinDrag.x, coinDrag.y, 16, 0, Math.PI * 2);
        ctx.fill();
      }
      if (drag) drawBolt(pointer.x, pointer.y);
      drawBow();
      const bag = bagPos();
      if (coinDrag) {
        ctx.strokeStyle = Math.hypot(pointer.x - bag.x, pointer.y - bag.y) < 100 ? "#9dff7a" : "#ffe08a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(bag.x, bag.y, 58, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (!drawSprite(sprites.bag, bag.x, bag.y, 120, 100, 0)) {
        ctx.fillStyle = "#c9844a";
        ctx.beginPath();
        ctx.ellipse(bag.x, bag.y, 46, 32, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      if (banner) {
        ctx.fillStyle = "#ffe08a";
        ctx.font = "bold 22px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(banner, w / 2, 78);
        ctx.textAlign = "left";
      }
      if (state !== "play") {
        ctx.fillStyle = "rgba(8,16,12,.66)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(state === "ready" ? "弓で城を守れ" : "城まで来てしまった", w / 2, h / 2 - 40);
        ctx.font = "18px sans-serif";
        const lines = state === "ready"
          ? ["矢をタップしてから十字をタップでも装填", "下側を左へ動かすと照準は右", "下に引いて離すと発射。コインは袋へ", "強化ボタンは必要なときだけ開く"]
          : ["得点 " + points + "　記録 " + best, "「はじめから」でもう一度"];
        lines.forEach((line, i) => ctx.fillText(line, w / 2, h / 2 + i * 28));
        ctx.textAlign = "left";
      }
    }
    resize();
    bestEl.textContent = best;
    sync();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
