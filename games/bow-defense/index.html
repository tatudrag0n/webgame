<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>弓のタワーディフェンス</title>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; overflow: hidden; }
    body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: #f4f7f2; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud {
      position: fixed; left: 16px; right: 16px; top: 12px;
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.45); z-index: 2;
    }
    a, button { pointer-events: auto; }
    a { color: #d7ffb8; }
    button {
      border: 0; border-radius: 12px; padding: 8px 12px; background: #ffb703; color: #1b1404; font-weight: 700; cursor: pointer;
    }
    #hint { font-size: 14px; color: #d5e6cf; }
  </style>
</head>
<body>
  <div class="hud">
    <div>ウェーブ <b id="wave">1</b>　得点 <b id="score">0</b>　城 <b id="hp">12</b><div id="hint">左の丸い矢をつかんで、クロスボウまで運ぶ。</div></div>
    <div><button id="again" type="button">はじめから</button>　<a href="../../index.html">もどる</a></div>
  </div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const waveEl = document.getElementById("wave");
    const scoreEl = document.getElementById("score");
    const hpEl = document.getElementById("hp");
    const hintEl = document.getElementById("hint");
    let w = 1, h = 1, dpr = 1;
    let pointer = {x: 0, y: 0};
    let bolts = [], enemies = [], shots = [], pops = [];
    let loaded = false, drawing = false, power = 0, aim = 0, bowX = null;
    let score = 0, castle = 12, wave = 1, spawnLeft = 0, spawnTimer = 0, restock = 0;
    let state = "play", drag = null;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const sprites = {};
    ["bow", "bolt", "slime", "slime2"].forEach(name => {
      const img = new Image();
      img.src = "img/" + name + ".png";
      sprites[name] = img;
    });
    function bowPos() {
      if (bowX == null) bowX = w * 0.56;
      return {x: bowX, y: Math.min(h - 210, h * 0.72)};
    }
    function followFinger() {
      const target = Math.max(230, Math.min(w - 90, pointer.x));
      bowX += (target - bowX) * 0.45;
      aim = Math.max(-1.05, Math.min(1.05, (pointer.x - w / 2) / (w * 0.33)));
    }
    function pathPoints() {
      const top = 78;
      const mid = h * 0.34;
      const low = Math.min(h * 0.56, bowPos().y - 70);
      return [
        {x: -30, y: top},
        {x: w * 0.78, y: top},
        {x: w * 0.78, y: mid},
        {x: w * 0.18, y: mid},
        {x: w * 0.18, y: low},
        {x: w * 0.86, y: low}
      ];
    }
    function pathInfo() {
      const pts = pathPoints();
      const lens = [];
      let total = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
        lens.push(len);
        total += len;
      }
      return {pts, lens, total};
    }
    function pointAt(dist) {
      const {pts, lens, total} = pathInfo();
      let left = Math.max(0, Math.min(dist, total));
      for (let i = 0; i < lens.length; i++) {
        if (left <= lens[i]) {
          const t = lens[i] ? left / lens[i] : 0;
          return {x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t};
        }
        left -= lens[i];
      }
      return {...pts[pts.length - 1]};
    }
    function rackBolts() {
      const b = bowPos();
      return bolts.map((bolt, i) => ({
        ...bolt,
        x: 78 + (i % 3) * 46,
        y: b.y - 34 + Math.floor(i / 3) * 46
      }));
    }
    function reset() {
      bolts = Array.from({length: 6}, (_, i) => ({id: i + 1}));
      enemies = []; shots = []; pops = [];
      loaded = false; drawing = false; power = 0; aim = 0; drag = null;
      score = 0; castle = 12; wave = 1;
      spawnLeft = 7; spawnTimer = 0.7; restock = 0; state = "play";
      sync();
    }
    function sync() {
      waveEl.textContent = wave;
      scoreEl.textContent = score;
      hpEl.textContent = castle;
      hintEl.textContent = loaded
        ? "右へ動かすとクロスボウも右へ動く。下に引いて離すと発射。"
        : "左の大きな矢をつかんで、クロスボウまで運ぶ。矢をタップしてから弓をタップでも装填できる。";
    }
    function spawn() {
      const tough = wave > 3 && Math.random() < 0.34;
      enemies.push({
        dist: 0,
        r: tough ? 22 : 16,
        hp: (tough ? 4 : 2) + Math.floor(wave / 2),
        max: (tough ? 4 : 2) + Math.floor(wave / 2),
        speed: (tough ? 42 : 58) + wave * 3,
        color: tough ? "#79c0ea" : "#86d98a",
        score: tough ? 20 : 10
      });
    }
    function eventPos(ev) {
      const r = canvas.getBoundingClientRect();
      const s = ev.clientX !== undefined ? ev : (ev.touches && ev.touches[0]);
      if (!s) return pointer;
      return {x: s.clientX - r.left, y: s.clientY - r.top};
    }
    function onDown(ev) {
      pointer = eventPos(ev);
      if (state !== "play") return;
      if (canvas.setPointerCapture && ev.pointerId !== undefined) {
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
      const hit = rackBolts().find(b => Math.hypot(b.x - pointer.x, b.y - pointer.y) < 42);
      if (hit && !loaded) {
        drag = hit;
        ev.preventDefault();
        return;
      }
      const b = bowPos();
      if (drag && Math.hypot(pointer.x - b.x, pointer.y - b.y) < 150) return;
      if (!drag && loaded && Math.hypot(pointer.x - b.x, pointer.y - b.y) < 150) {
        drawing = true;
        ev.preventDefault();
      }
    }
    function onMove(ev) {
      pointer = eventPos(ev);
      if (drag) ev.preventDefault();
      if (!drawing) return;
      followFinger();
      const b = bowPos();
      power = Math.max(0, Math.min(1, (pointer.y - b.y) / 130));
    }
    function loadFromDrag() {
      if (!drag || loaded) return;
      loaded = true;
      bolts = bolts.filter(item => item.id !== drag.id);
      drag = null;
      sync();
    }
    function onUp(ev) {
      if (ev && ev.clientX !== undefined) pointer = eventPos(ev);
      if (drag) {
        const b = bowPos();
        const onBow = Math.hypot(pointer.x - b.x, pointer.y - b.y) < 160;
        if (onBow) loadFromDrag();
        else sync();
      } else if (drawing) {
        if (power > 0.2) fire();
        drawing = false;
        power = 0;
      }
    }
    function fire() {
      const b = bowPos();
      const ang = -Math.PI / 2 + aim;
      const speed = 540 + power * 720;
      shots.push({
        x: b.x + Math.cos(ang) * 50,
        y: b.y + Math.sin(ang) * 50,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: 2.2
      });
      loaded = false;
      sync();
    }
    canvas.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.getElementById("again").onclick = reset;
    window.addEventListener("resize", resize);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "play") update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    function update(dt) {
      if (bolts.length < 6) {
        restock -= dt;
        if (restock <= 0) {
          bolts.push({id: Date.now() + Math.random()});
          restock = 0.9;
        }
      }
      const {total} = pathInfo();
      if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnLeft -= 1;
          spawnTimer = Math.max(0.4, 1.05 - wave * 0.06);
        }
      } else if (!enemies.length && !shots.length) {
        if (wave >= 8) state = "win";
        else {
          wave += 1;
          spawnLeft = 6 + wave;
          spawnTimer = 1.2;
          sync();
        }
      }
      enemies.forEach(e => e.dist += e.speed * dt);
      const leaked = enemies.filter(e => e.dist >= total);
      if (leaked.length) {
        castle -= leaked.length;
        enemies = enemies.filter(e => e.dist < total);
        sync();
        if (castle <= 0) { castle = 0; state = "lose"; sync(); }
      }
      shots.forEach(s => {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 240 * dt;
        s.life -= dt;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          const p = pointAt(e.dist);
          if (Math.hypot(p.x - s.x, p.y - s.y) < e.r + 7) {
            e.hp -= 1;
            s.life = 0;
            pops.push({x: p.x, y: p.y, life: 0.28});
            if (e.hp <= 0) score += e.score;
          }
        }
      });
      shots = shots.filter(s => s.life > 0 && s.x > -40 && s.x < w + 40 && s.y < h + 40);
      const before = enemies.length;
      enemies = enemies.filter(e => e.hp > 0);
      if (enemies.length !== before) sync();
      pops.forEach(p => p.life -= dt);
      pops = pops.filter(p => p.life > 0);
    }
    function drawPath() {
      const {pts} = pathInfo();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#c8b27a";
      ctx.lineWidth = 42;
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
      ctx.strokeStyle = "#efe0b8";
      ctx.lineWidth = 6;
      ctx.setLineDash([12, 12]);
      ctx.stroke();
      ctx.setLineDash([]);
      const gate = pts[pts.length - 1];
      ctx.fillStyle = "#d7c08a";
      ctx.fillRect(gate.x - 8, gate.y - 34, 46, 68);
      ctx.fillStyle = "#8d5a34";
      ctx.fillRect(gate.x + 6, gate.y - 8, 18, 42);
      ctx.fillStyle = "#f4f7f2";
      ctx.font = "14px sans-serif";
      ctx.fillText("城", gate.x + 8, gate.y - 42);
    }
    function drawSprite(img, x, y, dw, dh, rot) {
      if (!img || !img.complete || !img.naturalWidth) return false;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot || 0);
      ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
      return true;
    }
    function drawBow() {
      const b = bowPos();
      const pull = drawing ? power * 42 : 0;
      if (!drawSprite(sprites.bow, b.x, b.y + 20, 210, 300, aim)) {
        ctx.fillStyle = "#6a4328";
        ctx.fillRect(b.x - 16, b.y - 20, 32, 90);
      }
      if (loaded || drawing) drawSprite(sprites.bolt, b.x + Math.sin(aim) * (8 + pull), b.y - 36 + pull, 28, 150, aim);
    }
    function drawBolt(x, y) {
      if (!drawSprite(sprites.bolt, x, y, 22, 78, 0)) {
        ctx.strokeStyle = "#f0d48a";
        ctx.beginPath();
        ctx.moveTo(x, y + 16);
        ctx.lineTo(x, y - 16);
        ctx.stroke();
      }
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#16364a");
      sky.addColorStop(1, "#1d4634");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      drawPath();
      const b = bowPos();
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(28, b.y - 78, 168, 132);
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.strokeRect(28, b.y - 78, 168, 132);
      rackBolts().forEach(bolt => {
        ctx.fillStyle = "rgba(255,255,255,.16)";
        ctx.beginPath();
        ctx.arc(bolt.x, bolt.y, 20, 0, Math.PI * 2);
        ctx.fill();
        drawBolt(bolt.x, bolt.y);
      });
      enemies.forEach(e => {
        const p = pointAt(e.dist);
        const img = e.color === "#79c0ea" ? sprites.slime2 : sprites.slime;
        if (!drawSprite(img, p.x, p.y, e.r * 3.2, e.r * 3.2, 0)) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#203828";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28, 4);
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(p.x - 14, p.y - e.r - 10, 28 * Math.max(0, e.hp / e.max), 4);
      });
      shots.forEach(s => {
        const ang = Math.atan2(s.vy, s.vx) + Math.PI / 2;
        if (!drawSprite(sprites.bolt, s.x, s.y, 24, 92, ang)) {
          ctx.strokeStyle = "#f4e2b0";
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
          ctx.stroke();
        }
      });
      pops.forEach(p => {
        ctx.fillStyle = `rgba(255, 224, 130, ${p.life * 3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });
      if (drag) drawBolt(pointer.x, pointer.y);
      drawBow();
      if (state !== "play") {
        ctx.fillStyle = "rgba(8,16,12,.6)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(state === "win" ? "守りきった！" : "城まで来てしまった", w / 2, h / 2);
        ctx.font = "18px sans-serif";
        ctx.fillText("「はじめから」でもう一度", w / 2, h / 2 + 36);
        ctx.textAlign = "left";
      }
    }
    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
