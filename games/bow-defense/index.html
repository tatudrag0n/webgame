<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>弓のタワーディフェンス</title>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; overflow: hidden; }
    body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: #f4f7f2; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .hud {
      position: fixed; left: 16px; right: 16px; top: 12px;
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.45);
    }
    a, button { pointer-events: auto; }
    a { color: #d7ffb8; }
    button {
      border: 0; border-radius: 12px; padding: 8px 12px; background: #ffb703; color: #1b1404; font-weight: 700; cursor: pointer;
    }
    .hint {
      position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
      color: #d5e6cf; font-size: 14px; pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>ウェーブ <b id="wave">1</b>　得点 <b id="score">0</b>　城 <b id="hp">12</b></div>
    <div><button id="again" type="button">はじめから</button>　<a href="../../index.html">もどる</a></div>
  </div>
  <canvas id="c"></canvas>
  <div class="hint" id="hint">左の矢をクロスボウまでドラッグして装填。弦を下に引いて離すと発射。</div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const waveEl = document.getElementById("wave");
    const scoreEl = document.getElementById("score");
    const hpEl = document.getElementById("hp");
    const hintEl = document.getElementById("hint");
    let w = 1, h = 1, dpr = 1;
    let pointer = {x: 0, y: 0, down: false};
    let bolts = [], enemies = [], shots = [], pops = [];
    let loaded = false, drawing = false, power = 0, aim = 0;
    let goldScore = 0, castle = 12, wave = 1, spawnLeft = 0, spawnTimer = 0, restock = 0;
    let state = "play", drag = null, holdStart = null;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function bow() { return {x: w * 0.5, y: h - 118}; }
    function rackBolts() {
      const list = [];
      bolts.forEach((b, i) => list.push({...b, x: 58 + (i % 4) * 28, y: h - 78 - Math.floor(i / 4) * 18, i}));
      return list;
    }
    function reset() {
      bolts = Array.from({length: 8}, (_, i) => ({id: i}));
      enemies = []; shots = []; pops = [];
      loaded = false; drawing = false; power = 0; aim = 0; drag = null;
      goldScore = 0; castle = 12; wave = 1;
      spawnLeft = 7; spawnTimer = 0.8; restock = 0; state = "play";
      sync();
    }
    function sync() {
      waveEl.textContent = wave;
      scoreEl.textContent = goldScore;
      hpEl.textContent = castle;
      hintEl.textContent = loaded
        ? "弦を下へ引いて、離すと発射。左右でねらいを変える。"
        : "左の矢をクロスボウまでドラッグして装填。";
    }
    function spawn() {
      const tough = wave > 3 && Math.random() < 0.3;
      enemies.push({
        x: 80 + Math.random() * (w - 160),
        y: -30,
        r: tough ? 26 : 18,
        hp: (tough ? 4 : 2) + Math.floor(wave / 2),
        max: (tough ? 4 : 2) + Math.floor(wave / 2),
        vy: (tough ? 38 : 56) + wave * 4,
        sway: Math.random() * 40,
        phase: Math.random() * 6,
        color: tough ? "#79c0ea" : "#86d98a",
        score: tough ? 20 : 10
      });
    }
    function pos(ev) {
      const r = canvas.getBoundingClientRect();
      const s = ev.touches ? ev.touches[0] : ev;
      return {x: s.clientX - r.left, y: s.clientY - r.top};
    }
    function onDown(ev) {
      pointer = pos(ev);
      pointer.down = true;
      if (state !== "play") return;
      const rack = rackBolts();
      const hit = rack.find(b => Math.hypot(b.x - pointer.x, b.y - pointer.y) < 20);
      if (hit && !loaded) {
        drag = hit;
        return;
      }
      const b = bow();
      if (loaded && Math.hypot(pointer.x - b.x, pointer.y - b.y) < 150) {
        drawing = true;
        holdStart = {...pointer};
      }
    }
    function onMove(ev) {
      pointer = pos(ev);
      pointer.down = true;
      if (!drawing) return;
      const b = bow();
      aim = Math.max(-1.15, Math.min(1.15, (pointer.x - b.x) / 220));
      power = Math.max(0, Math.min(1, (pointer.y - (b.y - 10)) / 150));
    }
    function onUp(ev) {
      pointer.down = false;
      if (drag) {
        const b = bow();
        if (!loaded && Math.hypot(pointer.x - b.x, pointer.y - (b.y - 20)) < 120) {
          loaded = true;
          bolts = bolts.filter(item => item.id !== drag.id);
        }
        drag = null;
        sync();
      } else if (drawing) {
        if (power > 0.22) fire();
        drawing = false;
        power = 0;
      }
    }
    function fire() {
      const b = bow();
      const ang = -Math.PI / 2 + aim;
      const speed = 520 + power * 760;
      shots.push({
        x: b.x + Math.cos(ang) * 46,
        y: b.y + Math.sin(ang) * 46,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: 2.4
      });
      loaded = false;
      power = 0;
      sync();
    }
    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    document.getElementById("again").onclick = reset;
    window.addEventListener("resize", resize);

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state === "play") update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    function update(dt) {
      if (bolts.length < 6) {
        restock -= dt;
        if (restock <= 0) {
          bolts.push({id: Math.random()});
          restock = 0.85;
        }
      }
      if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnLeft -= 1;
          spawnTimer = Math.max(0.35, 1.05 - wave * 0.07);
        }
      } else if (!enemies.length && !shots.length) {
        if (wave >= 8) state = "win";
        else {
          wave += 1;
          spawnLeft = 6 + wave;
          spawnTimer = 1.3;
          sync();
        }
      }
      enemies.forEach(e => {
        e.y += e.vy * dt;
        e.x += Math.sin(e.y / 50 + e.phase) * e.sway * dt;
        e.x = Math.max(e.r, Math.min(w - e.r, e.x));
      });
      const leaked = enemies.filter(e => e.y > h - 70);
      if (leaked.length) {
        castle -= leaked.length;
        enemies = enemies.filter(e => e.y <= h - 70);
        sync();
        if (castle <= 0) { castle = 0; state = "lose"; sync(); }
      }
      shots.forEach(s => {
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 280 * dt;
        s.life -= dt;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 6) {
            e.hp -= 1;
            s.life = 0;
            pops.push({x: e.x, y: e.y, life: 0.28});
            if (e.hp <= 0) goldScore += e.score;
          }
        }
      });
      shots = shots.filter(s => s.life > 0 && s.y < h + 40 && s.x > -40 && s.x < w + 40);
      const before = enemies.length;
      enemies = enemies.filter(e => e.hp > 0);
      if (enemies.length !== before) sync();
      pops.forEach(p => p.life -= dt);
      pops = pops.filter(p => p.life > 0);
    }
    function drawBow() {
      const b = bow();
      const ang = -Math.PI / 2 + aim;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang + Math.PI / 2);
      const pull = drawing ? power * 78 : 0;
      ctx.fillStyle = "#6a4328";
      ctx.fillRect(-16, -20, 32, 92);
      ctx.fillStyle = "#8b5a34";
      ctx.fillRect(-46, 40, 92, 22);
      ctx.strokeStyle = "#d7c08a";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-120, -8);
      ctx.quadraticCurveTo(0, -70, 120, -8);
      ctx.stroke();
      ctx.strokeStyle = "#f4f7f2";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-112, -6);
      ctx.lineTo(0, 18 + pull);
      ctx.lineTo(112, -6);
      ctx.stroke();
      if (loaded || drawing) {
        ctx.strokeStyle = "#f0d48a";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 18 + pull);
        ctx.lineTo(0, -34);
        ctx.stroke();
        ctx.fillStyle = "#c9e6ff";
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(-7, -28);
        ctx.lineTo(7, -28);
        ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = "#f2d2a2";
      ctx.beginPath();
      ctx.arc(b.x, b.y + 58, 16, 0, Math.PI * 2);
      ctx.fill();
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#16364a");
      sky.addColorStop(1, "#1d4634");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#214c38";
      ctx.fillRect(0, h - 70, w, 70);
      ctx.fillStyle = "#c8b27a";
      ctx.fillRect(0, h - 76, w, 8);
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#173024";
        ctx.beginPath();
        ctx.arc(e.x - 5, e.y - 3, 2.4, 0, Math.PI * 2);
        ctx.arc(e.x + 5, e.y - 3, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#203828";
        ctx.fillRect(e.x - 14, e.y - e.r - 8, 28, 4);
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(e.x - 14, e.y - e.r - 8, 28 * Math.max(0, e.hp / e.max), 4);
      });
      shots.forEach(s => {
        ctx.strokeStyle = "#f4e2b0";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
        ctx.stroke();
      });
      pops.forEach(p => {
        ctx.fillStyle = `rgba(255, 224, 130, ${p.life * 3})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(24, h - 132, 150, 78);
      rackBolts().forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.strokeStyle = "#f0d48a";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.lineTo(0, -12);
        ctx.stroke();
        ctx.fillStyle = "#c9e6ff";
        ctx.beginPath();
        ctx.moveTo(0, -16);
        ctx.lineTo(-5, -6);
        ctx.lineTo(5, -6);
        ctx.fill();
        ctx.restore();
      });
      if (drag) {
        ctx.save();
        ctx.translate(pointer.x, pointer.y);
        ctx.strokeStyle = "#fff1b8";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 14);
        ctx.lineTo(0, -16);
        ctx.stroke();
        ctx.fillStyle = "#c9e6ff";
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-6, -8);
        ctx.lineTo(6, -8);
        ctx.fill();
        ctx.restore();
      }
      drawBow();
      if (state !== "play") {
        ctx.fillStyle = "rgba(8,16,12,.6)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(state === "win" ? "守りきった！" : "城まで来てしまった", w / 2, h / 2);
        ctx.font = "18px sans-serif";
        ctx.fillText("「はじめから」でもう一度", w / 2, h / 2 + 36);
        ctx.textAlign = "left";
      }
    }
    resize();
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
