<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まるばつ</title>
  <style>
    :root { --bg:#0f1220; --ink:#f4f6fb; --muted:#a8b0c7; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: var(--ink); background: var(--bg);
    }
    .wrap { width: min(380px, 100%); padding: 16px; text-align: center; }
    h1 { margin: 0 0 8px; }
    .meta { color: var(--muted); min-height: 24px; margin-bottom: 12px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button.cell {
      aspect-ratio: 1; border: 0; border-radius: 16px; background: #243056;
      color: white; font-size: 48px; cursor: pointer;
    }
    button.cell:disabled { cursor: default; }
    button.reset { margin-top: 14px; border: 0; border-radius: 12px; padding: 10px 16px; background: #ffb703; font-weight: 700; cursor: pointer; }
    a { color: #7bd389; margin-left: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>まるばつ</h1>
    <div class="meta" id="status">あなたは ○ 。好きなマスを押してね。</div>
    <div class="board" id="board"></div>
    <button class="reset" id="reset" type="button">もう一度</button>
    <a href="../../index.html">もどる</a>
  </div>
  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let cells, over;

    function winner(mark) {
      return lines.some(line => line.every(i => cells[i] === mark));
    }
    function empty() { return cells.map((v, i) => v ? null : i).filter(v => v !== null); }
    function render() {
      boardEl.innerHTML = "";
      cells.forEach((v, i) => {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        b.textContent = v;
        b.disabled = Boolean(v) || over;
        b.onclick = () => play(i);
        boardEl.appendChild(b);
      });
    }
    function finish(text) {
      over = true;
      statusEl.textContent = text;
      render();
    }
    function computer() {
      const spots = empty();
      if (!spots.length || over) return;
      let pick = spots.find(i => {
        cells[i] = "×";
        const win = winner("×");
        cells[i] = "";
        return win;
      });
      if (pick === undefined) {
        pick = spots.find(i => {
          cells[i] = "○";
          const block = winner("○");
          cells[i] = "";
          return block;
        });
      }
      if (pick === undefined && spots.includes(4)) pick = 4;
      if (pick === undefined) pick = spots[Math.floor(Math.random() * spots.length)];
      cells[pick] = "×";
      if (winner("×")) return finish("コンピュータの勝ち。もう一度やってみよう。");
      if (!empty().length) return finish("引き分け！");
      statusEl.textContent = "あなたの番です。";
      render();
    }
    function play(i) {
      if (over || cells[i]) return;
      cells[i] = "○";
      if (winner("○")) return finish("あなたの勝ち！");
      if (!empty().length) return finish("引き分け！");
      statusEl.textContent = "コンピュータが考えています…";
      render();
      setTimeout(computer, 280);
    }
    function start() {
      cells = Array(9).fill("");
      over = false;
      statusEl.textContent = "あなたは ○ 。好きなマスを押してね。";
      render();
    }
    document.getElementById("reset").onclick = start;
    start();
  </script>
</body>
</html>
