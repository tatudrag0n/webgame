<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <style>
    :root { --bg:#0f1220; --ink:#f4f6fb; --muted:#a8b0c7; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "Hiragino Sans", sans-serif; color: var(--ink); background: var(--bg);
    }
    .wrap { width: min(420px, 100%); padding: 16px; text-align: center; }
    h1 { margin: 0; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 14px; }
    .score { background: #243056; border-radius: 12px; padding: 8px 12px; min-width: 84px; }
    .score b { display: block; font-size: 20px; }
    .score span { color: var(--muted); font-size: 12px; }
    .board {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      background: #171c2e; padding: 8px; border-radius: 16px; touch-action: none;
    }
    .cell {
      aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center;
      font-weight: 800; background: #2a314b; font-size: 24px;
    }
    .n2 { background:#eee4da; color:#776e65; } .n4 { background:#ede0c8; color:#776e65; }
    .n8 { background:#f2b179; color:#f9f6f2; } .n16 { background:#f59563; color:#f9f6f2; }
    .n32 { background:#f67c5f; color:#f9f6f2; } .n64 { background:#f65e3b; color:#f9f6f2; }
    .n128 { background:#edcf72; color:#f9f6f2; font-size: 20px; }
    .n256 { background:#edcc61; color:#f9f6f2; font-size: 20px; }
    .n512 { background:#edc850; color:#f9f6f2; font-size: 20px; }
    .n1024, .n2048, .n4096 { background:#edc22e; color:#f9f6f2; font-size: 16px; }
    button, a { margin-top: 14px; }
    button { border: 0; border-radius: 12px; padding: 10px 16px; background: #ffb703; font-weight: 700; cursor: pointer; }
    a { color: #7bd389; margin-left: 12px; }
    .msg { min-height: 24px; color: #ffb703; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>2048</h1>
    <div class="row">
      <div class="score"><span>スコア</span><b id="score">0</b></div>
      <div class="score"><span>ベスト</span><b id="best">0</b></div>
    </div>
    <div class="board" id="board"></div>
    <div class="msg" id="msg"></div>
    <button id="reset" type="button">もう一度</button>
    <a href="../../index.html">もどる</a>
  </div>
  <script>
    const boardEl = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const msgEl = document.getElementById("msg");
    let grid, score, best = Number(localStorage.getItem("g2048-best") || 0);
    bestEl.textContent = best;

    function blank() { return Array.from({length: 4}, () => Array(4).fill(0)); }
    function emptyCells() {
      const list = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) list.push([r, c]);
      return list;
    }
    function addTile() {
      const cells = emptyCells();
      if (!cells.length) return;
      const [r, c] = cells[Math.floor(Math.random() * cells.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
    function draw() {
      boardEl.innerHTML = "";
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        const v = grid[r][c];
        const d = document.createElement("div");
        d.className = "cell" + (v ? " n" + v : "");
        d.textContent = v || "";
        boardEl.appendChild(d);
      }
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem("g2048-best", String(best));
      }
      bestEl.textContent = best;
    }
    function slide(line) {
      const nums = line.filter(Boolean);
      const out = [];
      for (let i = 0; i < nums.length; i++) {
        if (nums[i] === nums[i + 1]) {
          out.push(nums[i] * 2);
          score += nums[i] * 2;
          i++;
        } else out.push(nums[i]);
      }
      while (out.length < 4) out.push(0);
      return out;
    }
    function move(dir) {
      const before = JSON.stringify(grid);
      if (dir === "left") grid = grid.map(slide);
      if (dir === "right") grid = grid.map(row => slide(row.slice().reverse()).reverse());
      if (dir === "up" || dir === "down") {
        const cols = [0, 1, 2, 3].map(c => grid.map(row => row[c]));
        const next = cols.map(col => dir === "up" ? slide(col) : slide(col.slice().reverse()).reverse());
        grid = [0, 1, 2, 3].map(r => next.map(col => col[r]));
      }
      if (JSON.stringify(grid) === before) return;
      addTile();
      draw();
      if (grid.flat().includes(2048)) msgEl.textContent = "2048 達成！ このまま続けられるよ";
      if (!canMove()) msgEl.textContent = "これ以上うごかせないよ";
    }
    function canMove() {
      if (emptyCells().length) return true;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
      }
      return false;
    }
    function start() {
      grid = blank();
      score = 0;
      msgEl.textContent = "";
      addTile();
      addTile();
      draw();
    }
    const map = {ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down"};
    window.addEventListener("keydown", e => {
      if (!map[e.key]) return;
      e.preventDefault();
      move(map[e.key]);
    });
    let x0 = 0, y0 = 0;
    boardEl.addEventListener("touchstart", e => {
      x0 = e.changedTouches[0].clientX;
      y0 = e.changedTouches[0].clientY;
    }, {passive: true});
    boardEl.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
      else move(dy > 0 ? "down" : "up");
    }, {passive: true});
    document.getElementById("reset").onclick = start;
    start();
  </script>
</body>
</html>
